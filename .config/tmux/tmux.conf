# ---------------------------- Options ----------------------------

# Default shell to fish
set -g default-command $SHELL
set -g default-shell $SHELL

# Mouse support
set -g mouse on

# Larger history limit
set -g history-limit 100000

# Faster command sequence
set -g escape-time 0

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Faster status refresh interval
set -g status-interval 5

# Enable focus events
set -g focus-events on

# Better window resizing
set -g aggressive-resize on

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Yank to clipboard
set -g set-clipboard on

# Emacs keys in command prompt
set -g status-keys emacs

# Vi copy mode
set -g mode-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-selection
bind -T copy-mode-vi C-q send-keys -X rectangle-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-n send-keys -X next-prompt
bind -T copy-mode-vi C-p send-keys -X previous-prompt

# Paste buffer
bind v paste-buffer
bind C-v paste-buffer

# Disable visual notification of activity in other windows
set -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence on

# Don't exit from tmux when closing a session
set -g detach-on-destroy off

# Clock mode
set -g clock-mode-style 24

# Extended keys
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on

# ---------------------------- Key bindings ----------------------------

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind R run-shell " \
        tmux source-file ~/.config/tmux/tmux.conf > /dev/null; \
        tmux display-message 'Sourced ~/.config/tmux/tmux.conf!'"

# Put new window next to current by default
bind -T prefix c new-window -a
bind -T prefix C-c new-window -a

# Swap windows
bind -T prefix P swap-window -t -1 \; select-window -t -1
bind -T prefix N swap-window -t +1 \; select-window -t +1

# Change layout
bind -T prefix . next-layout
bind -T prefix C-. next-layout

# Switch windows
bind C-n next-window
bind C-p previous-window

bind a last-window
bind C-a last-window

# Switch last session
bind L switch-client -l
bind C-L switch-client -l

# Switch sessions
bind -T prefix h switch-client -p \; refresh-client -S
bind -T prefix C-h switch-client -p \; refresh-client -S
bind -T prefix '(' switch-client -p\; refresh-client -S

bind -T prefix l switch-client -n \; refresh-client -S
bind -T prefix C-l switch-client -n \; refresh-client -S
bind -T prefix ')' switch-client -n\; refresh-client -S

# Open panes in cwd & more comfy binds
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

bind m resize-pane -Z

# Disable confirm before killing pane
bind x kill-pane

# Kill current session with confirmation
bind -T prefix X confirm-before -p "kill-session #S? (y/n)" kill-session

bind s display-popup -w 36 -h 18 -T "Select directory" -E "ron-tmux-sessionizer"
bind C-s display-popup -w 36 -h 18 -T "Select directory" -E "ron-tmux-sessionizer"
bind S "choose-tree"

# Toggle opencode window
bind o run-shell "ron-tmux-opencode-toggle"
bind c-o run-shell "ron-tmux-opencode-toggle"

# ---------------------------- UI ----------------------------

# Theme (nor.nvim) — ron-theme-apply reloads tmux.conf on switch
if-shell 'fish -c "test (ron-theme-get) = light"' \
    "source-file ~/.config/tmux/themes/nor-light.tmuxtheme" \
    "source-file ~/.config/tmux/themes/nor-dark.tmuxtheme"

set -g status-left-length 100
set -g status-right-length 100

# smart-splits.nvim (https://github.com/mrjones2014/smart-splits.nvim#tmux)

# '@pane-is-vim' is a pane-local option that is set by the plugin on load,
# and unset when Neovim exits or suspends; note that this means you'll probably
# not want to lazy-load smart-splits.nvim, as the variable won't be set until
# the plugin is loaded

# Smart pane switching with awareness of Neovim splits.
bind -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
bind -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
bind -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
bind -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'

# Alternatively, if you want to disable wrapping when moving in non-neovim panes, use these bindings
# bind-key -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { if -F '#{pane_at_left}'   '' 'select-pane -L' }
# bind-key -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
# bind-key -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { if -F '#{pane_at_top}'    '' 'select-pane -U' }
# bind-key -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { if -F '#{pane_at_right}'  '' 'select-pane -R' }

# Smart pane resizing with awareness of Neovim splits.
bind -n C-S-h if -F "#{@pane-is-vim}" 'send-keys C-S-h' 'resize-pane -L 3'
bind -n C-S-j if -F "#{@pane-is-vim}" 'send-keys C-S-j' 'resize-pane -D 3'
bind -n C-S-k if -F "#{@pane-is-vim}" 'send-keys C-S-k' 'resize-pane -U 3'
bind -n C-S-l if -F "#{@pane-is-vim}" 'send-keys C-S-l' 'resize-pane -R 3'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\\\'  'select-pane -l'"

bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l
